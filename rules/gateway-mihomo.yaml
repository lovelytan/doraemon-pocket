mixed-port: 7890
mode: rule
allow-lan: true
log-level: silent
external-controller: 0.0.0.0:80
external-ui: ui
external-ui-url: 'https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip'

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: system
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

hosts:
  29592fdc743801.163cdn-agent.com: 6ae5ec6c-59f0-11f2.163cdn-agent.com
  29592fdc743802.163cdn-agent.com: 6ae5ec6c-59f0-11f1.163cdn-agent.com
  29592fdc743803.163cdn-agent.com: 6ae5ec6c-59f0-11f3.163cdn-agent.com
  e3b4a336-5086.163cdn-agent.com: 0a97169c-59fa-11f.163cdn-agent.com

dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - geosite:private
    - geosite:cn
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.home.arpa'
    - '*.arpa'
    - '*.invalid'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - localhost.work.weixin.qq.com
    - '+.ptlogin2.qq.com'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.apple.com'
    - time-ios.apple.com
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '*.ntp.org.cn'
    - '*.time.edu.cn'
    - 'time.*.edu.cn'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - stun.l.google.com
    - lens.l.google.com
    - '+.xboxlive.com'
    - '+.xbone.online'
    - 'xbox.*.microsoft.com'
    - '+.market.xiaomi.com'
    - '+.163cdn-agent.com'
  use-hosts: true
  use-system-hosts: true
  proxy-server-nameserver:
    - udp://127.0.0.1:1053
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

geodata-mode: true
geox-url:
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb

# 机场节点订阅
proxy-providers:
  ytoo:
    type: http
    url: 'https://58ffd55a743e.ai-163cdn.com/sub?target=clash&filename=YToo&new_name=true&scv=true&tfo=false&clash.doh=true&emoji=true&udp=true&url=https%3A%2F%2Fapi.ytoo.xyz%2Fosubscribe.php%3Fsid%3D79484%26token%3DfYTyxzVnhvk7'
    path: ./proxy-providers/ytoo.yaml
    interval: 0
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

# 策略组引用机场节点
proxy-groups:
  - name: 🚀 节点选择
    type: select
    use:
      - ytoo
    proxies: [🗺 地区节点, ⬇️ 低倍节点, DIRECT]

  - name: 🗺 地区节点
    type: select
    proxies:
      [
        🇭🇰 香港节点,
        🇨🇳 台湾节点,
        🇯🇵 日本节点,
        🇸🇬 新加坡节点,
        🇰🇷 韩国节点,
        🇺🇲 美国节点
      ]

  # 地区
  - name: 🇭🇰 香港节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all: true
    exclude-type: direct
    filter: '(?i)香港|🇭🇰|hk|hongkong|hong kong'

  - name: 🇨🇳 台湾节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all: true
    exclude-type: direct
    filter: '(?i)台湾|🇨🇳|Taiwan|TW'

  - name: 🇯🇵 日本节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all: true
    exclude-type: direct
    filter: '(?i)日本|🇯🇵|Japan|JP|东京'

  - name: 🇸🇬 新加坡节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all: true
    exclude-type: direct
    filter: '(?i)新加坡|🇸🇬|Singapore|SG|狮城'

  - name: 🇰🇷 韩国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all: true
    exclude-type: direct
    filter: '(?i)韩国|🇰🇷|Korea|Kr'

  - name: 🇺🇲 美国节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all: true
    exclude-type: direct
    filter: '(?i)美国|🇺🇸|American|US'

  # 其他
  - name: ⬇️ 低倍节点
    type: select
    include-all: true
    exclude-type: direct
    filter: '(^|[^0-9])0\.[0-9]+|低'

  - name: 💬 人工智能
    type: select
    include-all: true
    exclude-type: direct
    proxies:
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇰🇷 韩国节点
      - 🇺🇲 美国节点

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  - GEOSITE,category-ai-!cn,💬 人工智能
  - GEOSITE,google,🚀 节点选择
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,apple-cn,DIRECT

  - GEOIP,telegram,🚀 节点选择,no-resolve
  - GEOSITE,telegram,🚀 节点选择

  - GEOSITE,gfw,🚀 节点选择

  - GEOIP,CN,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT

  - MATCH,🚀 节点选择
